name: Prebuilt APK Validation

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Verify prebuilt APKs
      run: |
        test -f prebuilt/arm/SystemWebView.apk
        test -f prebuilt/arm64/SystemWebView.apk

    - name: Run lint
      run: |
        echo "No lint configured for this project"
